<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Cabin Crew Academy</title>
<meta name="description" content="Examen final de tripulante de cabina convertido en app: lecciones gamificadas, fichas Anki y simulacros.">
<meta name="theme-color" content="#1E93E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1626" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cabin Crew">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div id="app">
  <header id="hud" hidden></header>
  <main id="screen"></main>
  <nav id="tabs" hidden aria-label="Navegación principal"></nav>
</div>
<canvas id="fx-canvas" hidden aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/srs.js"></script>
<script src="js/store.js"></script>
<script src="js/avatars.js"></script>
<script src="js/achievements.js"></script>
<script src="js/fx.js"></script>
<script src="js/exercise.js"></script>
<script src="js/app.js"></script>
<script src="js/views/welcome.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/quiz.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/browse.js"></script>
<script src="js/views/profile.js"></script>
<script>
  CC.app.boot();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
